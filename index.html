<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Telemetry Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <header>
        <h1>F1 Telemetry Dashboard</h1>

        <div class="search-box">

            <input id="sessionKey" placeholder="Session Key (e.g. Monaco Quali)">

            <input id="driverNumber" placeholder="Driver Number (e.g. 16)">

            <button onclick="loadData()">
                Load Session
            </button>

        </div>
    </header>

    <div id="driverCard" class="card">
        Select a session and driver.
    </div>

    <div class="stats">

        <div class="card stat-card">
            <h3>Fastest Lap</h3>
            <span id="fastestLap">--</span>
        </div>

        <div class="card stat-card">
            <h3>Position</h3>
            <span id="position">--</span>
        </div>

        <div class="card stat-card">
            <h3>Average Lap</h3>
            <span id="averageLap">--</span>
        </div>

        <div class="card stat-card">
            <h3>Top Speed</h3>
            <span id="topSpeed">--</span>
        </div>

        <div class="card stat-card">
            <h3>Throttle Avg</h3>
            <span id="avgThrottle">--</span>
        </div>

        <div class="card stat-card">
            <h3>Brake Usage</h3>
            <span id="brakeUsage">--</span>
        </div>

    </div>

    <div class="card">

        <h2>Sectors</h2>

        <div class="sector-grid">

            <div class="sector">
                <h4>Sector 1</h4>
                <span id="s1">--</span>
            </div>

            <div class="sector">
                <h4>Sector 2</h4>
                <span id="s2">--</span>
            </div>

            <div class="sector">
                <h4>Sector 3</h4>
                <span id="s3">--</span>
            </div>

        </div>

    </div>

    <div class="card">
        <h2>Track Map</h2>
        <canvas id="trackMap"></canvas>
    </div>

    <div class="card">
        <h2>Speed</h2>
        <canvas id="speedChart"></canvas>
    </div>

    <div class="card">
        <h2>Throttle</h2>
        <canvas id="throttleChart"></canvas>
    </div>

    <div class="card">
        <h2>Brake</h2>
        <canvas id="brakeChart"></canvas>
    </div>

    <div class="card">
        <h2>Gear</h2>
        <canvas id="gearChart"></canvas>
    </div>

    <div class="card">
        <h2>RPM</h2>
        <canvas id="rpmChart"></canvas>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
